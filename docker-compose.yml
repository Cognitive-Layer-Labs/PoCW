# PoCW engine stack: FalkorDB (knowledge graphs) + Redis (sessions) + engine (HTTP API).
#
# Only the engine is published, and only on the host loopback (127.0.0.1:${ENGINE_PORT}).
# The landing app (separate repo/compose) joins the external network "pocw" and calls
# http://engine:3000 server-side with "Authorization: Bearer $POCW_API_KEY".
# FalkorDB and Redis live on a separate internal network the landing cannot reach.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build

name: pocw

services:
  falkordb:
    image: falkordb/falkordb:v4.20.7
    restart: unless-stopped
    environment:
      BROWSER: "0"   # do not start the bundled FalkorDB Browser UI
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}
      REDIS_ARGS: >-
        --requirepass ${FALKORDB_PASSWORD}
        --maxmemory ${FALKORDB_MAXMEMORY:-512mb}
        --maxmemory-policy noeviction
        --appendonly yes
        --auto-aof-rewrite-min-size 64mb
        --auto-aof-rewrite-percentage 100
        --save 300 10
    volumes:
      - falkordb_data:/data
    deploy:
      resources:
        limits:
          memory: ${FALKORDB_MEM_LIMIT:-640m}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$FALKORDB_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-192m}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  engine:
    build: .
    image: pocw-engine:local
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENGINE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      POCW_API_KEY: ${POCW_API_KEY:?set POCW_API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ALLOW_MODEL_OVERRIDE: ${ALLOW_MODEL_OVERRIDE:-}
      AI_CONFIG_PATH: ${AI_CONFIG_PATH:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-pocw}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - engine_data:/app/data
    deploy:
      resources:
        limits:
          memory: ${ENGINE_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pocw
      - backend

networks:
  # Shared with the landing app: `networks: { pocw: { external: true } }` in its compose.
  pocw:
    name: pocw
    driver: bridge
  # Datastores only — no route to the outside world, not reachable from the landing.
  backend:
    name: pocw_backend
    driver: bridge
    internal: true

volumes:
  falkordb_data:
  redis_data:
  engine_data:
